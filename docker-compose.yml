services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./proppulse.db
      - API_KEY=pp_secret_v1_prod_key
    volumes:
      - .:/app

  dashboard:
    build: .
    ports:
      - "8501:8501"
    command: streamlit run proppulse_os/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - api
    environment:
      - DATABASE_URL=sqlite:///./proppulse.db
      - API_KEY=pp_secret_v1_prod_key
    volumes:
      - .:/app
